    resources:
    - name: cons
      path: /cons
      operations:
      - name: getconnections
        method: GET
        description: Apache ZooKeeper List Client Connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: crst
      path: /crst
      operations:
      - name: resetconnectionstats
        method: GET
        description: Apache ZooKeeper Reset Connection Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: dump
      path: /dump
